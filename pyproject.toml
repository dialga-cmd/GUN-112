[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gun101"
version = "2.1.0"
description = "A simple, secure file encryption tool using AES-256-GCM and Argon2id"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Aditya Raj"}
]
keywords = ["encryption", "security", "file", "AES", "Argon2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.2"
]

[project.urls]
Homepage = "https://github.com/dialga-cmd/gun101"

[project.scripts]
gun101 = "gun101.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.5.0",
    "bandit>=1.7.0",
    "pip-audit>=2.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/gun101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=gun101 --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]